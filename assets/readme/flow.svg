<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="flowTitle flowDesc">
  <title id="flowTitle">一次清理的四个步骤</title>
  <desc id="flowDesc">四个步骤沿一条竖脊自上而下推进：打开面板即自动扫描；7.2 秒量完 21 项目录体积；模型给出优先级与理由，推荐项已预选；确认后逐项回报释放量与失败原因，本例回收站 1.1 GB 加临时文件 512 MB 共释放 1.6 GB。</desc>

  <rect width="1200" height="300" rx="24" fill="#0A0E15"/>

  <text x="56" y="56" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="680" fill="#E9EEF9">一次清理的四个步骤</text>
  <text x="1144" y="56" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#4A5670">scan → rank → pick → clean</text>

  <!-- the spine: one continuous line with four nodes, not four separate cards -->
  <line x1="72" y1="108" x2="72" y2="260" stroke="#1E2634" stroke-width="1.5"/>

  <g id="steps" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <!-- 01 -->
    <circle cx="72" cy="108" r="9" fill="#0A0E15" stroke="#5B9BFF" stroke-width="1.6"/>
    <circle cx="72" cy="108" r="3.2" fill="#5B9BFF"/>
    <text x="100" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5B9BFF">01</text>
    <text x="100" y="130" font-size="20" font-weight="620" fill="#E9EEF9">打开面板</text>
    <text x="232" y="130" font-size="18" fill="#A7B4CC">侧边栏点磁盘图标，扫描随即开始，无需再点任何按钮</text>

    <!-- 02 -->
    <circle cx="72" cy="160" r="9" fill="#0A0E15" stroke="#5B9BFF" stroke-width="1.6"/>
    <circle cx="72" cy="160" r="3.2" fill="#5B9BFF"/>
    <text x="100" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5B9BFF">02</text>
    <text x="100" y="182" font-size="20" font-weight="620" fill="#E9EEF9">扫描 + 排序</text>
    <text x="232" y="182" font-size="18" fill="#A7B4CC">7.2 秒量完 21 项目录体积，模型同时给出优先级与理由</text>
    <text x="1144" y="182" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#7D8AA3">列表已可勾选</text>

    <!-- 03 -->
    <circle cx="72" cy="212" r="9" fill="#0A0E15" stroke="#5B9BFF" stroke-width="1.6"/>
    <circle cx="72" cy="212" r="3.2" fill="#5B9BFF"/>
    <text x="100" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5B9BFF">03</text>
    <text x="100" y="234" font-size="20" font-weight="620" fill="#E9EEF9">勾选确认</text>
    <text x="232" y="234" font-size="18" fill="#A7B4CC">推荐项已预选，确认框写明项数与预计释放量</text>

    <!-- 04 -->
    <circle cx="72" cy="260" r="9" fill="#0A0E15" stroke="#34D399" stroke-width="1.6"/>
    <circle cx="72" cy="260" r="3.2" fill="#34D399"/>
    <text x="100" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#34D399">04</text>
    <text x="100" y="282" font-size="20" font-weight="620" fill="#E9EEF9">清理回报</text>
    <text x="232" y="282" font-size="18" fill="#A7B4CC">逐项列出释放量，失败项给出具体原因</text>
    <text x="1144" y="282" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#34D399">+1.6 GB</text>
  </g>
</svg>
