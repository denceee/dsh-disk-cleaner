<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">dsh-disk-cleaner — DSH 侧边栏磁盘清理插件</title>
  <desc id="heroDesc">左侧是项目名 dsh-disk-cleaner，说明为：先量出每个目录占多少，再让模型排出优先级和理由，勾选即清理。下方两个用量环：C 盘 93.6%（200 GB 剩 13 GB，告急红）、D 盘 77.4%（275.8 GB 剩 62 GB，强调蓝）。右侧是真实面板的复现：表头含模型选择器与 7.2 秒扫描耗时，清理项列表列出 pnpm 存储 7.9 GB（仅提示）、回收站 1.1 GB（谨慎）、用户临时文件 512 MB（安全）、Edge 缓存 519 MB（安全），底部显示已选 2 项、预计释放 1.6 GB。全部数字取自本机真实扫描结果。</desc>

  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#0A0E15"/>
      <stop offset="1" stop-color="#070A10"/>
    </linearGradient>
    <!-- The accent wash echoes the panel's own header glow; it is the only
         gradient in the asset and it describes the product surface. -->
    <radialGradient id="heroWash" cx="0.14" cy="0" r="0.75">
      <stop offset="0" stop-color="#5B9BFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5B9BFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="panelClip"><rect x="660" y="40" width="492" height="340" rx="16"/></clipPath>
  </defs>

  <rect width="1200" height="420" rx="26" fill="url(#heroBg)"/>
  <rect width="1200" height="420" rx="26" fill="url(#heroWash)"/>

  <!-- ============================ identity ============================ -->
  <g id="hero-identity">
    <text x="56" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="2.6" fill="#5B9BFF">DSH PLUGIN</text>
    <text x="196" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="2.6" fill="#4A5670">SIDEBAR</text>

    <text x="56" y="136" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="52" font-weight="700" letter-spacing="-0.5" fill="#E9EEF9">dsh-disk-cleaner</text>

    <text x="56" y="182" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" fill="#A7B4CC">先量出每个目录占多少，再让模型排出</text>
    <text x="56" y="212" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" fill="#A7B4CC">优先级和理由 —— 勾选即清理。</text>

    <!-- capacity rings: the project motif, same construction as the live panel -->
    <g id="hero-rings" transform="translate(56 252)">
      <!-- C: critical -->
      <circle cx="26" cy="26" r="21" fill="none" stroke="#1A2130" stroke-width="6"/>
      <circle cx="26" cy="26" r="21" fill="none" stroke="#FF6B81" stroke-width="6" stroke-linecap="round"
              stroke-dasharray="123.5 131.9" transform="rotate(-90 26 26)"/>
      <text x="26" y="31" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#E9EEF9">C</text>

      <text x="66" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#FF6B81">93.6%</text>
      <text x="66" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#7D8AA3">13 GB free</text>

      <!-- D: healthy -->
      <circle cx="198" cy="26" r="21" fill="none" stroke="#1A2130" stroke-width="6"/>
      <circle cx="198" cy="26" r="21" fill="none" stroke="#5B9BFF" stroke-width="6" stroke-linecap="round"
              stroke-dasharray="102.1 131.9" transform="rotate(-90 198 26)"/>
      <text x="198" y="31" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#E9EEF9">D</text>

      <text x="238" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#5B9BFF">77.4%</text>
      <text x="238" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#7D8AA3">62 GB free</text>
    </g>

    <line x1="56" y1="330" x2="592" y2="330" stroke="#1E2634"/>

    <text x="56" y="360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#7D8AA3">6 host routes · structural discovery · 204 assertions</text>
    <!-- action cue, quiet: the path itself is the arrow, no drawn duplicate -->
    <text x="56" y="392" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#E9EEF9">侧边栏 <tspan fill="#5B9BFF">→</tspan> 磁盘清理</text>
  </g>

  <!-- ========================= real panel ============================ -->
  <g id="hero-panel">
    <rect x="660" y="40" width="492" height="340" rx="16" fill="#121722" stroke="#263044"/>
    <g clip-path="url(#panelClip)">
      <!-- header: title, status, model picker -->
      <text x="682" y="76" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="600" fill="#E9EEF9">磁盘清理</text>
      <text x="682" y="97" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#7D8AA3">扫描完成 · 7.2 秒</text>

      <rect x="975" y="60" width="157" height="26" rx="8" fill="#0E131C" stroke="#263044"/>
      <text x="987" y="77" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7D8AA3">模型</text>
      <text x="1019" y="77" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#E9EEF9">qodercn</text>
      <path d="M1119 71l4 4 4-4" stroke="#7D8AA3" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- drive cards with rings, mirroring the hero motif. Values are the
           real totals from this machine's scan (README「一次真实扫描」). -->
      <rect x="682" y="112" width="222" height="60" rx="12" fill="#0C1018" stroke="#263044"/>
      <circle cx="708" cy="142" r="16" fill="none" stroke="#1A2130" stroke-width="4.5"/>
      <circle cx="708" cy="142" r="16" fill="none" stroke="#FF6B81" stroke-width="4.5" stroke-linecap="round"
              stroke-dasharray="94 100.5" transform="rotate(-90 708 142)"/>
      <text x="708" y="146.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#E9EEF9">C</text>
      <text x="734" y="137" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#E9EEF9">C: 盘</text>
      <text x="734" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7D8AA3">已用 93.6% · 13 GB 可用</text>

      <rect x="914" y="112" width="222" height="60" rx="12" fill="#0C1018" stroke="#263044"/>
      <circle cx="940" cy="142" r="16" fill="none" stroke="#1A2130" stroke-width="4.5"/>
      <circle cx="940" cy="142" r="16" fill="none" stroke="#5B9BFF" stroke-width="4.5" stroke-linecap="round"
              stroke-dasharray="77.8 100.5" transform="rotate(-90 940 142)"/>
      <text x="940" y="146.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#E9EEF9">D</text>
      <text x="966" y="137" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#E9EEF9">D: 盘</text>
      <text x="966" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7D8AA3">已用 77.4% · 62 GB 可用</text>

      <!-- advice strip: neutral surface, accent only for the label -->
      <rect x="682" y="184" width="454" height="36" rx="10" fill="#0E131C" stroke="#1E2634"/>
      <text x="696" y="207" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="640" fill="#7D8AA3">AI 建议</text>
      <text x="752" y="207" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#C3CDDF">先清回收站与临时文件，随后单独处理系统缓存</text>

      <!-- rows in the order the panel actually sorts them: report-only last -->
      <rect x="694" y="238" width="13" height="13" rx="3.5" fill="#5B9BFF"/>
      <path d="M697 244.5l2.4 2.6 4-4.6" stroke="#0A0D12" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="717" y="249" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#E9EEF9">回收站</text>
      <rect x="766" y="236" width="40" height="17" rx="8.5" fill="#F5B33C" fill-opacity="0.1" stroke="#F5B33C" stroke-opacity="0.34"/>
      <text x="786" y="248" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#F5B33C">谨慎</text>
      <text x="1124" y="249" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#E9EEF9">1.1 GB</text>
      <text x="717" y="264" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#7D8AA3">AI：体积最大的单一项，清空可立即释放</text>

      <rect x="694" y="284" width="13" height="13" rx="3.5" fill="#5B9BFF"/>
      <path d="M697 290.5l2.4 2.6 4-4.6" stroke="#0A0D12" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="717" y="295" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#E9EEF9">用户临时文件</text>
      <rect x="810" y="282" width="40" height="17" rx="8.5" fill="#34D399" fill-opacity="0.1" stroke="#34D399" stroke-opacity="0.34"/>
      <text x="830" y="294" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#34D399">安全</text>
      <text x="1124" y="295" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#E9EEF9">512 MB</text>
      <text x="717" y="310" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#7D8AA3">AI：活目录已按白名单跳过，可安全重建</text>

      <!-- row 3: report-only, unchecked, dimmed -->
      <rect x="694" y="326" width="13" height="13" rx="3.5" fill="none" stroke="#3A465C" stroke-width="1.4"/>
      <text x="717" y="337" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#7D8AA3">pnpm 存储</text>
      <rect x="802" y="324" width="52" height="17" rx="8.5" fill="none" stroke="#3A465C" stroke-width="1"/>
      <text x="828" y="336" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#7D8AA3">仅提示</text>
      <text x="1124" y="337" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#7D8AA3">7.9 GB</text>

      <!-- footer: selection summary, meter, single primary action -->
      <line x1="682" y1="352" x2="1136" y2="352" stroke="#1E2634"/>
      <text x="682" y="371" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7D8AA3">已选 2 项 · 预计释放 1.6 GB</text>
      <rect x="1010" y="352" width="122" height="26" rx="8" fill="#2E6BE6"/>
      <text x="1071" y="369" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">清理选中项</text>
    </g>
  </g>
</svg>
